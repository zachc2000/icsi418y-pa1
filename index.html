<!DOCTYPE html>
<html>
<head>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
<h1>TaskMaster! 1.0</h1>
<input id="tsk-import-select" type="file" accept="application/json" hidden>
<button id="tsk-import">Import</button>
<button id="tsk-export">Export</button>
<button id="tsk-clear">Clear</button>
</header>

<main>
    <form id="tsk-add-form">
        <h2>Add Task</h2>
        <input id="tsk-name-in" type="text" required>
        <select id="tsk-priority-in" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button id="tsk-in-submit" type="submit">Add</button>
    </form>
    <div id="tsk-list"></div>
</main>

<footer>
<sub>(c) 2026 Zachary Casso</sub>
</footer>
</body>
</html>
